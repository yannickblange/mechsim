<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MechSim symbol smoke test</title>
  <style>
    body { margin: 16px; background: #1a2620; color: #e9eee4; font-family: system-ui, sans-serif; }
    canvas { display: block; border: 1px solid #9fb0a4; }
  </style>
</head>
<body>
  <h1>Symbol smoke test</h1>
  <canvas id="c" width="900" height="300"></canvas>
  <script type="module">
    import { Camera } from '/js/canvas/camera.js';
    import { drawSpring } from '/js/canvas/symbols/spring.js';
    import { drawBlock } from '/js/canvas/symbols/block.js';
    import { drawPinSupport } from '/js/canvas/symbols/supports.js';

    const theme = {
      background: '#22332b', grid: 'rgba(233,238,228,0.07)', ink: '#e9eee4',
      muted: '#9fb0a4', spring: '#f0c96a', support: '#9cc3e6', force: '#e8868a',
    };
    const ctx = document.getElementById('c').getContext('2d');
    ctx.fillStyle = theme.background;
    ctx.fillRect(0, 0, 900, 300);

    const cam = new Camera();
    cam.width = 900;
    cam.height = 300;
    cam.center = [0, 0];
    cam.scale = 100;

    // Springs of 0.5 m, 1 m, 2 m and a diagonal one (frame-format entries).
    const springs = [
      { p1: [-4.2, 1.2], p2: [-3.7, 1.2] },
      { p1: [-4.2, 0.6], p2: [-3.2, 0.6] },
      { p1: [-4.2, 0.0], p2: [-2.2, 0.0] },
      { p1: [-4.2, -0.6], p2: [-3.2, -1.3] },
    ];
    springs.forEach((p, i) => drawSpring(ctx, cam, { id: `s${i}`, type: 'spring' }, { id: `s${i}`, ...p }, theme));

    // Blocks 0.4 x 0.3 at phi = 0, 0.5, pi/2.
    [0, 0.5, Math.PI / 2].forEach((phi, i) => {
      const spec = { id: `b${i}`, type: 'block', params: { mass: 1, width: 0.4, height: 0.3 } };
      drawBlock(ctx, cam, spec, { id: spec.id, x: -0.5 + i * 1.2, y: 0.5, phi, vx: 0, vy: 0, omega: 0 }, theme);
    });

    // Pin support.
    drawPinSupport(ctx, cam, { id: 'A', type: 'pin_support' }, { id: 'A', position: [3.5, 0.3], reaction: [0, 0] }, theme);
  </script>
</body>
</html>
