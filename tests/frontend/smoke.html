<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MechSim symbol smoke test</title>
  <style>
    body { margin: 16px; background: #1a2620; color: #e9eee4; font-family: system-ui, sans-serif; }
    canvas { display: block; border: 1px solid #9fb0a4; }
  </style>
</head>
<body>
  <h1>Symbol smoke test</h1>
  <canvas id="c" width="900" height="300"></canvas>
  <h1>v0.2 symbols</h1>
  <canvas id="c2" width="900" height="360"></canvas>
  <h1>v0.3 symbols</h1>
  <canvas id="c3" width="900" height="300"></canvas>
  <script type="module">
    import { Camera } from '/js/canvas/camera.js';
    import { drawSpring } from '/js/canvas/symbols/spring.js';
    import { drawBlock } from '/js/canvas/symbols/block.js';
    import { drawPinSupport } from '/js/canvas/symbols/supports.js';

    const theme = {
      background: '#22332b', grid: 'rgba(233,238,228,0.07)', ink: '#e9eee4',
      muted: '#9fb0a4', spring: '#f0c96a', support: '#9cc3e6', force: '#e8868a',
    };
    const ctx = document.getElementById('c').getContext('2d');
    ctx.fillStyle = theme.background;
    ctx.fillRect(0, 0, 900, 300);

    const cam = new Camera();
    cam.width = 900;
    cam.height = 300;
    cam.center = [0, 0];
    cam.scale = 100;

    // Springs of 0.5 m, 1 m, 2 m and a diagonal one (frame-format entries).
    const springs = [
      { p1: [-4.2, 1.2], p2: [-3.7, 1.2] },
      { p1: [-4.2, 0.6], p2: [-3.2, 0.6] },
      { p1: [-4.2, 0.0], p2: [-2.2, 0.0] },
      { p1: [-4.2, -0.6], p2: [-3.2, -1.3] },
    ];
    springs.forEach((p, i) => drawSpring(ctx, cam, { id: `s${i}`, type: 'spring' }, { id: `s${i}`, ...p }, theme));

    // Blocks 0.4 x 0.3 at phi = 0, 0.5, pi/2.
    [0, 0.5, Math.PI / 2].forEach((phi, i) => {
      const spec = { id: `b${i}`, type: 'block', params: { mass: 1, width: 0.4, height: 0.3 } };
      drawBlock(ctx, cam, spec, { id: spec.id, x: -0.5 + i * 1.2, y: 0.5, phi, vx: 0, vy: 0, omega: 0 }, theme);
    });

    // Pin support.
    drawPinSupport(ctx, cam, { id: 'A', type: 'pin_support' }, { id: 'A', position: [3.5, 0.3], reaction: [0, 0] }, theme);
  </script>
  <script type="module">
    // v0.2: disc, surface, loads, oriented supports, spring ghost.
    import { Camera } from '/js/canvas/camera.js';
    import { drawDisc } from '/js/canvas/symbols/disc.js';
    import { drawLoad } from '/js/canvas/symbols/load.js';
    import { drawSpring, drawSpringGhost } from '/js/canvas/symbols/spring.js';
    import { drawSurface } from '/js/canvas/symbols/surface.js';
    import { drawFixedSupport, drawPinSupport, drawRollerSupport } from '/js/canvas/symbols/supports.js';

    const theme = {
      background: '#22332b', ink: '#e9eee4', muted: '#9fb0a4', spring: '#f0c96a', support: '#9cc3e6', force: '#e8868a',
    };
    const ctx = document.getElementById('c2').getContext('2d');
    ctx.fillStyle = theme.background;
    ctx.fillRect(0, 0, 900, 360);
    const cam = new Camera();
    cam.width = 900;
    cam.height = 360;
    cam.center = [0, 0];
    cam.scale = 100;

    // Surfaces at 0, 30, 90 degrees and one drawn right to left (hatching on the right-hand side).
    const surfaces = [
      { p1: [-4.2, -1.2], p2: [-2.4, -1.2] },
      { p1: [-2.0, -1.3], p2: [-0.5, -0.43] },
      { p1: [0.2, 1.5], p2: [0.2, -1.5] },
      { p1: [2.5, 1.5], p2: [1.0, 1.5] },
    ];
    surfaces.forEach((s) => drawSurface(ctx, cam, s, theme));

    // Supports: Festlager, fixed Lager, Loslager on the floor; Loslager on the 30 degree surface; Festlager on the ceiling.
    drawPinSupport(ctx, cam, { params: { angle: 0 } }, { position: [-3.8, -1.2] }, theme);
    drawFixedSupport(ctx, cam, { params: { angle: 0 } }, { position: [-3.2, -1.2] }, theme);
    drawRollerSupport(ctx, cam, { params: { angle: 0 } }, { position: [-2.6, -1.2] }, theme);
    drawRollerSupport(ctx, cam, { params: { angle: Math.PI / 6 } }, { position: [-1.25, -0.865] }, theme);
    drawPinSupport(ctx, cam, { params: { angle: Math.PI } }, { position: [1.7, 1.5] }, theme);
    drawFixedSupport(ctx, cam, { params: { angle: -Math.PI / 2 } }, { position: [0.2, 0.3] }, theme);

    // Discs, loads: constant force, impulse, moments in both directions, force + moment.
    drawDisc(ctx, cam, { id: 'd1', params: { radius: 0.3 } }, { x: -3.2, y: -0.7, phi: 0.6 }, theme);
    const load = (id, p, params, extra = {}) =>
      drawLoad(ctx, cam, { id, params }, { id, p1: p, p2: p, vector: params.force, moment: params.moment, mode: params.mode, ...extra }, theme);
    load('F', [-3.2, -0.7], { force: [8, 6], mode: 'constant' });
    load('J', [-1.2, 0.8], { force: [0, -10], mode: 'impulse' });
    load('J2', [-1.2, 0.2], { force: [10, 0], mode: 'impulse' }, { active: false });
    load('M+', [0.9, 0.5], { force: [0, 0], moment: 5, mode: 'constant' });
    load('M-', [1.5, 0.5], { force: [0, 0], moment: -5, mode: 'constant' });
    load('FM', [2.4, -0.4], { force: [6, 0], moment: 3, mode: 'constant' });

    // Spring (installed) with its ghost: tension (ghost shorter) and compression (ghost longer).
    drawSpring(ctx, cam, {}, { p1: [-4.2, 1.2], p2: [-2.4, 1.2] }, theme);
    drawSpringGhost(ctx, cam, [-4.2, 1.2], [-2.4, 1.2], 1.0, theme);
    drawSpring(ctx, cam, {}, { p1: [-4.2, 0.6], p2: [-3.2, 0.6] }, theme);
    drawSpringGhost(ctx, cam, [-4.2, 0.6], [-3.2, 0.6], 1.6, theme);
  </script>
  <script type="module">
    // v0.3: rope (taut and slack), Stab, joints.
    import { Camera } from '/js/canvas/camera.js';
    import { drawFixedJoint, drawPinJoint } from '/js/canvas/symbols/joint.js';
    import { drawRod } from '/js/canvas/symbols/rod.js';
    import { drawRope } from '/js/canvas/symbols/rope.js';
    import { drawPinSupport } from '/js/canvas/symbols/supports.js';

    const theme = {
      background: '#22332b', ink: '#e9eee4', muted: '#9fb0a4', spring: '#f0c96a', support: '#9cc3e6',
      force: '#e8868a', rope: '#dcae78',
    };
    const ctx = document.getElementById('c3').getContext('2d');
    ctx.fillStyle = theme.background;
    ctx.fillRect(0, 0, 900, 300);
    const cam = new Camera();
    cam.width = 900;
    cam.height = 300;
    cam.center = [0, 0];
    cam.scale = 100;
    const rope = (p1, p2, length, taut) => drawRope(ctx, cam, { params: { length } }, { p1, p2, length, taut }, theme);
    rope([-4, 1.2], [-2, 1.2], 2, true); // taut
    rope([-4, 0.6], [-2, 0.6], 2.4, false); // slack, hangs down
    rope([-4, -0.2], [-3.2, -1.2], 1.8, false); // slack, diagonal
    rope([-1.5, 1.4], [-1.5, 0.2], 1.6, false); // slack, vertical: sideways
    drawRod(ctx, cam, {}, { p1: [-0.6, 1.3], p2: [1.0, 0.2] }, theme);
    drawRod(ctx, cam, {}, { p1: [0.2, -1.2], p2: [1.8, -1.2] }, theme);
    drawPinSupport(ctx, cam, { params: { angle: 0 } }, { position: [-0.6, 1.3] }, theme); // a free-space Festlager
    drawPinJoint(ctx, cam, {}, { position: [2.4, 0.5] }, theme);
    drawFixedJoint(ctx, cam, {}, { position: [3.4, 0.5] }, theme);
  </script>
</body>
</html>
