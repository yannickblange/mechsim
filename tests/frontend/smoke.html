<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MechSim symbol smoke test</title>
  <style>
    body { margin: 16px; background: #1a2620; color: #e9eee4; font-family: system-ui, sans-serif; }
    canvas { display: block; border: 1px solid #9fb0a4; }
  </style>
</head>
<body>
  <h1>Symbol smoke test</h1>
  <canvas id="c" width="900" height="300"></canvas>
  <h1>v0.2 symbols</h1>
  <canvas id="c2" width="900" height="360"></canvas>
  <h1>v0.3 symbols</h1>
  <canvas id="c3" width="900" height="300"></canvas>
  <h1>v0.3b supports spanning a gap to their surface</h1>
  <canvas id="c4" width="900" height="300"></canvas>
  <h1>v0.4 symbols: node, Stabs with forces, elastic bar, beams (true and exaggerated), harmonic load, light and dark</h1>
  <p><button id="toggle5" type="button">light / dark</button></p>
  <canvas id="c5" width="900" height="420"></canvas>
  <script type="module">
    import { Camera } from '/js/canvas/camera.js';
    import { drawSpring } from '/js/canvas/symbols/spring.js';
    import { drawBlock } from '/js/canvas/symbols/block.js';
    import { drawPinSupport } from '/js/canvas/symbols/supports.js';

    const theme = {
      background: '#22332b', grid: 'rgba(233,238,228,0.07)', ink: '#e9eee4',
      muted: '#9fb0a4', spring: '#f0c96a', support: '#9cc3e6', force: '#e8868a',
    };
    const ctx = document.getElementById('c').getContext('2d');
    ctx.fillStyle = theme.background;
    ctx.fillRect(0, 0, 900, 300);

    const cam = new Camera();
    cam.width = 900;
    cam.height = 300;
    cam.center = [0, 0];
    cam.scale = 100;

    // Springs of 0.5 m, 1 m, 2 m and a diagonal one (frame-format entries).
    const springs = [
      { p1: [-4.2, 1.2], p2: [-3.7, 1.2] },
      { p1: [-4.2, 0.6], p2: [-3.2, 0.6] },
      { p1: [-4.2, 0.0], p2: [-2.2, 0.0] },
      { p1: [-4.2, -0.6], p2: [-3.2, -1.3] },
    ];
    springs.forEach((p, i) => drawSpring(ctx, cam, { id: `s${i}`, type: 'spring' }, { id: `s${i}`, ...p }, theme));

    // Blocks 0.4 x 0.3 at phi = 0, 0.5, pi/2.
    [0, 0.5, Math.PI / 2].forEach((phi, i) => {
      const spec = { id: `b${i}`, type: 'block', params: { mass: 1, width: 0.4, height: 0.3 } };
      drawBlock(ctx, cam, spec, { id: spec.id, x: -0.5 + i * 1.2, y: 0.5, phi, vx: 0, vy: 0, omega: 0 }, theme);
    });

    // Pin support.
    drawPinSupport(ctx, cam, { id: 'A', type: 'pin_support' }, { id: 'A', position: [3.5, 0.3], reaction: [0, 0] }, theme);
  </script>
  <script type="module">
    // v0.2: disc, surface, loads, oriented supports, spring ghost.
    import { Camera } from '/js/canvas/camera.js';
    import { drawDisc } from '/js/canvas/symbols/disc.js';
    import { drawLoad } from '/js/canvas/symbols/load.js';
    import { drawSpring, drawSpringGhost } from '/js/canvas/symbols/spring.js';
    import { drawSurface } from '/js/canvas/symbols/surface.js';
    import { drawFixedSupport, drawPinSupport, drawRollerSupport } from '/js/canvas/symbols/supports.js';

    const theme = {
      background: '#22332b', ink: '#e9eee4', muted: '#9fb0a4', spring: '#f0c96a', support: '#9cc3e6', force: '#e8868a',
    };
    const ctx = document.getElementById('c2').getContext('2d');
    ctx.fillStyle = theme.background;
    ctx.fillRect(0, 0, 900, 360);
    const cam = new Camera();
    cam.width = 900;
    cam.height = 360;
    cam.center = [0, 0];
    cam.scale = 100;

    // Surfaces at 0, 30, 90 degrees and one drawn right to left (hatching on the right-hand side).
    const surfaces = [
      { p1: [-4.2, -1.2], p2: [-2.4, -1.2] },
      { p1: [-2.0, -1.3], p2: [-0.5, -0.43] },
      { p1: [0.2, 1.5], p2: [0.2, -1.5] },
      { p1: [2.5, 1.5], p2: [1.0, 1.5] },
    ];
    surfaces.forEach((s) => drawSurface(ctx, cam, s, theme));

    // Supports: Festlager, fixed Lager, Loslager on the floor; Loslager on the 30 degree surface; Festlager on the ceiling.
    drawPinSupport(ctx, cam, { params: { angle: 0 } }, { position: [-3.8, -1.2] }, theme);
    drawFixedSupport(ctx, cam, { params: { angle: 0 } }, { position: [-3.2, -1.2] }, theme);
    drawRollerSupport(ctx, cam, { params: { angle: 0 } }, { position: [-2.6, -1.2] }, theme);
    drawRollerSupport(ctx, cam, { params: { angle: Math.PI / 6 } }, { position: [-1.25, -0.865] }, theme);
    drawPinSupport(ctx, cam, { params: { angle: Math.PI } }, { position: [1.7, 1.5] }, theme);
    drawFixedSupport(ctx, cam, { params: { angle: -Math.PI / 2 } }, { position: [0.2, 0.3] }, theme);

    // Discs, loads: constant force, impulse, moments in both directions, force + moment.
    drawDisc(ctx, cam, { id: 'd1', params: { radius: 0.3 } }, { x: -3.2, y: -0.7, phi: 0.6 }, theme);
    const load = (id, p, params, extra = {}) =>
      drawLoad(ctx, cam, { id, params }, { id, p1: p, p2: p, vector: params.force, moment: params.moment, mode: params.mode, ...extra }, theme);
    load('F', [-3.2, -0.7], { force: [8, 6], mode: 'constant' });
    load('J', [-1.2, 0.8], { force: [0, -10], mode: 'impulse' });
    load('J2', [-1.2, 0.2], { force: [10, 0], mode: 'impulse' }, { active: false });
    load('M+', [0.9, 0.5], { force: [0, 0], moment: 5, mode: 'constant' });
    load('M-', [1.5, 0.5], { force: [0, 0], moment: -5, mode: 'constant' });
    load('FM', [2.4, -0.4], { force: [6, 0], moment: 3, mode: 'constant' });

    // Spring (installed) with its ghost: tension (ghost shorter) and compression (ghost longer).
    drawSpring(ctx, cam, {}, { p1: [-4.2, 1.2], p2: [-2.4, 1.2] }, theme);
    drawSpringGhost(ctx, cam, [-4.2, 1.2], [-2.4, 1.2], 1.0, theme);
    drawSpring(ctx, cam, {}, { p1: [-4.2, 0.6], p2: [-3.2, 0.6] }, theme);
    drawSpringGhost(ctx, cam, [-4.2, 0.6], [-3.2, 0.6], 1.6, theme);
  </script>
  <script type="module">
    // v0.3: rope (taut and slack), Stab, joints.
    import { Camera } from '/js/canvas/camera.js';
    import { drawFixedJoint, drawPinJoint } from '/js/canvas/symbols/joint.js';
    import { drawDamper } from '/js/canvas/symbols/damper.js';
    import { drawRod } from '/js/canvas/symbols/rod.js';
    import { drawRope } from '/js/canvas/symbols/rope.js';
    import { drawPinSupport } from '/js/canvas/symbols/supports.js';

    const theme = {
      background: '#22332b', ink: '#e9eee4', muted: '#9fb0a4', spring: '#f0c96a', support: '#9cc3e6',
      force: '#e8868a', rope: '#dcae78', damper: '#8fd1c0',
    };
    const ctx = document.getElementById('c3').getContext('2d');
    ctx.fillStyle = theme.background;
    ctx.fillRect(0, 0, 900, 300);
    const cam = new Camera();
    cam.width = 900;
    cam.height = 300;
    cam.center = [0, 0];
    cam.scale = 100;
    const rope = (p1, p2, length, taut) => drawRope(ctx, cam, { params: { length } }, { p1, p2, length, taut }, theme);
    rope([-4, 1.2], [-2, 1.2], 2, true); // taut
    rope([-4, 0.6], [-2, 0.6], 2.4, false); // slack, hangs down
    rope([-4, -0.2], [-3.2, -1.2], 1.8, false); // slack, diagonal
    rope([-1.5, 1.4], [-1.5, 0.2], 1.6, false); // slack, vertical: sideways
    drawRod(ctx, cam, {}, { p1: [-0.6, 1.3], p2: [1.0, 0.2] }, theme);
    drawDamper(ctx, cam, {}, { p1: [2.0, 1.3], p2: [3.6, 1.3] }, theme);
    drawDamper(ctx, cam, {}, { p1: [2.0, 0.9], p2: [2.5, 0.9] }, theme);
    drawDamper(ctx, cam, {}, { p1: [4.0, 1.4], p2: [4.0, -0.2] }, theme);
    drawRod(ctx, cam, {}, { p1: [0.2, -1.2], p2: [1.8, -1.2] }, theme);
    drawPinSupport(ctx, cam, { params: { angle: 0 } }, { position: [-0.6, 1.3] }, theme); // a free-space Festlager
    drawPinJoint(ctx, cam, {}, { position: [2.4, 0.5] }, theme);
    drawFixedJoint(ctx, cam, {}, { position: [3.4, 0.5] }, theme);
  </script>
  <script type="module">
    // v0.3b: Festlager, fixed Lager and Loslager scale to the distance to their surface (entry.height).
    import { Camera } from '/js/canvas/camera.js';
    import { drawSurface } from '/js/canvas/symbols/surface.js';
    import {
      drawFixedSupport, drawPinSupport, drawRollerSupport, supportHeight,
    } from '/js/canvas/symbols/supports.js';

    const theme = { background: '#22332b', ink: '#e9eee4', muted: '#9fb0a4', support: '#9cc3e6' };
    const ctx = document.getElementById('c4').getContext('2d');
    ctx.fillStyle = theme.background;
    ctx.fillRect(0, 0, 900, 300);
    const cam = new Camera();
    cam.width = 900;
    cam.height = 300;
    cam.center = [0, 0];
    cam.scale = 100;

    const draw = (fn, surface, angle, position) => {
      drawSurface(ctx, cam, surface, theme);
      fn(ctx, cam, { params: { angle } }, { position, height: supportHeight(surface, angle, position) }, theme);
    };
    // floor: gaps of 0 (default size), 0.3 m, 0.8 m, 1.3 m
    const floor = { p1: [-4.4, -1.4], p2: [-0.4, -1.4] };
    drawSurface(ctx, cam, floor, theme);
    [[-4.0, 0], [-3.2, 0.3], [-2.2, 0.8], [-1.0, 1.3]].forEach(([x, gap]) => {
      const position = [x, -1.4 + gap];
      drawPinSupport(ctx, cam, { params: { angle: 0 } }, { position, height: supportHeight(floor, 0, position) }, theme);
    });
    // roller and fixed on a second floor
    const floor2 = { p1: [0.2, -1.4], p2: [4.4, -1.4] };
    drawSurface(ctx, cam, floor2, theme);
    drawRollerSupport(ctx, cam, { params: { angle: 0 } }, { position: [1.0, -0.4], height: 1.0 }, theme);
    drawFixedSupport(ctx, cam, { params: { angle: 0 } }, { position: [2.4, -0.6], height: 0.8 }, theme);
    // incline: the support leg is perpendicular to the surface
    const a = Math.PI / 6;
    const slope = { p1: [2.8, -1.2], p2: [4.4, -0.28] };
    draw(drawPinSupport, slope, a, [3.5 - Math.sin(a) * -0.9, -0.8 + Math.cos(a) * 0.9 + 0.1]);
  </script>
  <script type="module">
    // v0.4: node, Stab (rigid and elastic, tension / compression), beam, harmonic load; both colour schemes.
    import { Camera } from '/js/canvas/camera.js';
    import { Renderer } from '/js/canvas/renderer.js';
    import { drawBeam } from '/js/canvas/symbols/beam.js';
    import { drawLoad } from '/js/canvas/symbols/load.js';
    import { drawNode } from '/js/canvas/symbols/node.js';
    import { drawBar, drawRod } from '/js/canvas/symbols/rod.js';
    import { drawPinSupport } from '/js/canvas/symbols/supports.js';

    // The colour scheme comes from css/main.css like in the app.
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '/css/main.css';
    document.head.append(link);
    await new Promise((resolve) => { link.onload = resolve; });
    document.body.style.cssText = 'margin:16px; background: var(--c-bg); color: var(--c-ink); font-family: system-ui, sans-serif';

    const canvas = document.getElementById('c5');
    const ctx = canvas.getContext('2d');
    const cam = new Camera();
    cam.width = 900;
    cam.height = 420;
    cam.center = [0, 0];
    cam.scale = 100;

    function paint() {
      const theme = Renderer.readTheme();
      ctx.fillStyle = theme.background;
      ctx.fillRect(0, 0, 900, 420);
      cam.bendScale = 1;

      // A little Fachwerk: nodes, a rigid Stab in tension, one in compression, an elastic bar, a Festlager.
      const N = { A: [-4.2, 0.4], B: [-2.6, 0.4], C: [-3.4, 1.4] };
      drawRod(ctx, cam, {}, { p1: N.A, p2: N.B, force: 1520 }, theme);
      drawRod(ctx, cam, {}, { p1: N.A, p2: N.C, force: -1130 }, theme);
      drawBar(ctx, cam, {}, { p1: N.C, p2: N.B, force: -250.5 }, theme);
      Object.entries(N).forEach(([k, p]) => drawNode(ctx, cam, { id: k }, { x: p[0], y: p[1] }, theme));
      drawPinSupport(ctx, cam, { params: { angle: 0 } }, { position: N.A }, theme);
      drawBar(ctx, cam, {}, { p1: [-2.2, 0.4], p2: [-0.9, 0.9], force: 0 }, theme);
      drawNode(ctx, cam, { id: 'free' }, { x: -2.2, y: 0.4 }, theme);

      // An elastic bar close to its Euler load: bent (the nodes of the frame), the label gives the percentage.
      const bentBar = { p1: [1.0, -1.6], p2: [2.8, -1.6], force: -4300, pcr: 4500,
        nodes: [0, 0.45, 0.9, 1.35, 1.8].map((t) => [1.0 + t, -1.6 + 0.22 * Math.sin(Math.PI * t / 1.8), 0.22 * Math.PI / 1.8 * Math.cos(Math.PI * t / 1.8)]) };
      drawBar(ctx, cam, {}, bentBar, theme);

      // Loads: constant, harmonic (arrow = value now, label = excitation).
      drawLoad(ctx, cam, { params: { force: [0, -20] } }, { p1: [0.2, 1.7], vector: [0, -20], force: 20, mode: 'constant', active: true }, theme);
      drawLoad(ctx, cam, { params: { force: [30, 0], mode: 'harmonic', frequency: 1.5 } }, { p1: [0.2, 0.6], vector: [21, 0], force: 30, mode: 'harmonic', active: true }, theme);

      // Beams: straight (editor), bent (a deflected cantilever: a parabola with its slope), the same exaggerated
      // 10 times, and a T beam turned by 30 degrees.
      const spec = { id: 'beam', params: { length: 3, section: { type: 'square', a: 0.08 } } };
      drawBeam(ctx, cam, spec, { x: -2.5, y: -0.3, phi: 0 }, theme);
      const bent = [0, 0.75, 1.5, 2.25, 3].map((x) => [x, -0.18 * (x / 3) ** 2, Math.atan(-0.36 * x / 9)]);
      const bentNode = (dx, dy) => ({ x: dx, y: dy, phi: 0, nodes: bent.map(([x, y, phi]) => [dx - 1.5 + x, dy + y, phi]), stress: 2.4e8 });
      drawBeam(ctx, cam, { ...spec, id: 'bent' }, bentNode(-2.5, -1.0), theme);
      cam.bendScale = 10;
      drawBeam(ctx, cam, { ...spec, id: 'x10' }, bentNode(-2.5, -1.8), theme);
      cam.bendScale = 1;
      const tspec = { id: 'T', params: { length: 2.4, section: { type: 'T', b: 0.4, h: 0.4, tf: 0.06, tw: 0.06 } } };
      drawBeam(ctx, cam, tspec, { x: 2.9, y: -0.4, phi: Math.PI / 6 }, theme);
    }
    paint();
    document.getElementById('toggle5').addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      paint();
    });
  </script>
</body>
</html>
