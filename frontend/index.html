<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MechSim</title>
  <link rel="stylesheet" href="/css/main.css">
  <script>
    /* Apply the remembered colour scheme before the first paint (no white flash in dark mode). */
    try { document.documentElement.dataset.theme = localStorage.getItem('mechsim.theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
  </script>
</head>
<body>
  <!-- Element ids are part of the frontend contract: main.js depends on them. Do not rename.
       The toolbox, hint line and property popup are created by js/editor/editor.js inside .stage. -->
  <header class="toolbar">
    <h1 class="app-name">MechSim</h1>

    <label class="field">
      <span>Scene</span>
      <select id="scene-select" aria-label="Scene"></select>
    </label>

    <button id="btn-new" type="button" title="Start an empty layout">New</button>
    <button id="btn-edit" type="button" aria-pressed="false" title="Edit the layout / return to the simulation">Edit</button>

    <div class="edit-controls" id="edit-controls" hidden>
      <input id="scene-name" type="text" placeholder="Layout name" aria-label="Layout name" maxlength="64" autocomplete="off">
      <button id="btn-save" type="button" title="Save as one of My layouts">Save</button>
      <button id="btn-undo" type="button" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo">↶</button>
      <button id="btn-redo" type="button" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo">↷</button>
    </div>

    <div class="transport" role="group" aria-label="Simulation controls">
      <button id="btn-play" type="button">Play</button>
      <button id="btn-step" type="button">Step</button>
      <button id="btn-reset" type="button">Reset</button>
    </div>

    <label class="field">
      <span>Speed</span>
      <select id="speed" aria-label="Simulation speed">
        <option value="0.1">0.1×</option>
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
    </label>

    <button id="btn-theme" type="button" aria-pressed="false" title="Switch between the light and the dark colour scheme">Dark</button>
  </header>

  <main class="stage">
    <canvas id="view" aria-label="Simulation view"></canvas>
    <div id="error" class="error" role="alert" hidden></div>
  </main>

  <footer class="statusbar">
    <span>t = <output id="time">0.000</output> s</span>
    <span>E<sub>kin</sub> = <output id="e-kin">–</output> J</span>
    <span>E<sub>pot</sub> = <output id="e-pot">–</output> J</span>
    <span>E<sub>total</sub> = <output id="e-total">–</output> J</span>
    <span class="spacer"></span>
    <span id="mode">–</span>
    <span id="conn" data-connected="false">Disconnected</span>
  </footer>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
